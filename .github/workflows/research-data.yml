name: Refresh research data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -p '*_test.py'
      - run: python update-research-data.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node data-integrity.test.cjs && node screener-v2.test.cjs
      - name: Save updated snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sourced research snapshot"
            git push
          fi
